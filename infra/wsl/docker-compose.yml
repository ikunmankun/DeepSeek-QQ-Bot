name: xiaomachi-linux-napcat-stack

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: xiaomachi-napcat
    restart: "no"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - ACCOUNT=${BOT_QQ:-}
      - NAPCAT_QUICK_PASSWORD=${NAPCAT_QUICK_PASSWORD:-}
      - NAPCAT_QUICK_PASSWORD_MD5=${NAPCAT_QUICK_PASSWORD_MD5:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${NAPCAT_HTTP_PORT:-6099}:6099"
      - "127.0.0.1:${NAPCAT_WS_PORT:-3001}:3001"
    volumes:
      - napcat_config:/app/napcat/config
      - napcat_logs:/app/napcat/logs
      - napcat_cache:/app/napcat/cache
      - napcat_ntqq:/app/.config/QQ
      - xiaomachi_data:/workspace/data:ro

  xiaomachi:
    image: xiaomachi-bot:local
    build:
      context: ../..
      dockerfile: infra/wsl/Dockerfile.xiaomachi
      # 本机补丁：原为 `network: host`。Docker 29 的 Bake 会把该声明转成
      # entitlement 申请，而 `docker compose build` 无法透传 --allow=network.host，
      # 构建会直接中止。本项目 DOCKER_HTTP_PROXY 为空，构建无需 host 网络，
      # 故移除；如需构建期走宿主代理，应改为启用 DOCKER_HTTP_PROXY 并使用桥接网络。
      args:
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-10}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        NO_PROXY: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,napcat,xiaomachi,host.docker.internal}
    container_name: xiaomachi-bot
    restart: "unless-stopped"
    network_mode: host
    working_dir: /workspace
    env_file:
      - ./.env
    environment:
      - NAPCAT_WS_URL=ws://127.0.0.1:3001
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Shanghai}
      # Keep the QQ/OneBot gateway direct. These runtime proxy settings apply
      # only to Xiaomachi's outbound providers (for example the LLM API).
      - HTTP_PROXY=${XIAOMACHI_HTTP_PROXY:-${DOCKER_HTTP_PROXY:-}}
      - HTTPS_PROXY=${XIAOMACHI_HTTPS_PROXY:-${DOCKER_HTTPS_PROXY:-}}
      - NO_PROXY=${XIAOMACHI_NO_PROXY:-${DOCKER_NO_PROXY:-localhost,127.0.0.1,napcat,xiaomachi,host.docker.internal}}
    volumes:
      - xiaomachi_data:/workspace/data
      - ./private-secrets:/run/xiaomachi-secrets:ro
      - xiaomachi_xhs_session:/workspace/data/xhs-crawler
      # Local sticker/meme library (read-only) for the pick_sticker tool.
      - ${LOCAL_STICKER_HOST_DIR:-/mnt/e/QQ-Bot/memes}:/workspace/memes:ro
      # Alarm voice clips (read-only): reminder worker picks one at random.
      - ${ALARM_SOUND_HOST_DIR:-/mnt/e/QQ-Bot/alarms}:/workspace/alarms:ro
      # 语音转文字：只读挂 napcat 的 QQ 数据卷（silk 原件）与 cache 卷
      # （get_record 转码产物），目标路径与 napcat 容器保持一致。
      - napcat_ntqq:/app/.config/QQ:ro
      - napcat_cache:/app/napcat/cache:ro
    depends_on:
      napcat:
        condition: service_started
    command: ["python", "-m", "app.group_main"]

  xiaomachi-private:
    # Private chat (persona conversation, drawings, reminders). NapCat
    # broadcasts every OneBot event to every connected client, so this process
    # shares the OneBot WebSocket with the group bot and ignores group payloads.
    # It reuses the image built by the xiaomachi service and the same data
    # volume; it never runs the memory/embedding startup work.
    image: xiaomachi-bot:local
    container_name: xiaomachi-private
    restart: "unless-stopped"
    network_mode: host
    working_dir: /workspace
    env_file:
      - ./.env
    environment:
      - NAPCAT_WS_URL=ws://127.0.0.1:3001
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Shanghai}
      # Keep the QQ/OneBot gateway direct. These runtime proxy settings apply
      # only to Xiaomachi's outbound providers (for example the LLM API).
      - HTTP_PROXY=${XIAOMACHI_HTTP_PROXY:-${DOCKER_HTTP_PROXY:-}}
      - HTTPS_PROXY=${XIAOMACHI_HTTPS_PROXY:-${DOCKER_HTTPS_PROXY:-}}
      - NO_PROXY=${XIAOMACHI_NO_PROXY:-${DOCKER_NO_PROXY:-localhost,127.0.0.1,napcat,xiaomachi,host.docker.internal}}
    volumes:
      - xiaomachi_data:/workspace/data
      - ./private-secrets:/run/xiaomachi-secrets:ro
      - xiaomachi_xhs_session:/workspace/data/xhs-crawler
      # 语音转文字（私聊语音）：同上，只读挂 napcat 数据卷与 cache 卷
      - napcat_ntqq:/app/.config/QQ:ro
      - napcat_cache:/app/napcat/cache:ro
    depends_on:
      napcat:
        condition: service_started
    command: ["python", "-m", "app.private_main"]

volumes:
  xiaomachi_xhs_session:
    external: true
    name: xiaomachi-xhs-session
  napcat_config:
    name: xiaomachi-napcat-config
  napcat_logs:
    name: xiaomachi-napcat-logs
  napcat_cache:
    name: xiaomachi-napcat-cache
  napcat_ntqq:
    name: xiaomachi-napcat-ntqq
  xiaomachi_data:
    external: true
    name: xiaomachi-bot-data
