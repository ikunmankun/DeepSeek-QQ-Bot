<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  #stage { width: 100%; height: 100%; }
  #bubble {
    position: absolute; max-width: 240px; padding: 9px 13px;
    background: #ffffffee; color: #1b2430; border-radius: 14px 14px 14px 3px;
    font: 13px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
    box-shadow: 0 6px 18px #0004; opacity: 0; transition: opacity .25s;
    pointer-events: none; white-space: pre-wrap; word-break: break-word;
    left: 50%; transform: translateX(-50%); top: 4px;
  }
  #bubble.show { opacity: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bubble"></div>
<script type="importmap">
